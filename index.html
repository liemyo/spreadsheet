<!doctype html>
<html lang="id" data-theme="glass-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amatu Sheets</title>
<meta name="description" content="Amatu Sheets — spreadsheet di browser dengan alur kerja Google Sheets dan fitur lanjutan Microsoft Excel: 400+ fungsi, array dinamis, format bersyarat, tabel pivot, diagram, impor/ekspor Excel.">
<meta name="theme-color" content="#e9eef6">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="loading">
<svg class="defs" width="0" height="0" aria-hidden="true">
  <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="34" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="wallpaper" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

<div id="app">
  <header class="topbar glass">
    <button id="app-logo" class="logo" type="button" data-tip="Buka spreadsheet" aria-label="Buka spreadsheet"><img src="icon.svg" alt="" width="34" height="34"></button>
    <div class="title-col">
      <div class="title-row">
        <input id="doc-title" class="doc-title" spellcheck="false" aria-label="Nama spreadsheet" value="Spreadsheet tanpa judul">
        <span id="save-state" class="save-state"></span>
      </div>
      <nav id="menubar" class="menubar" aria-label="Menu"></nav>
    </div>
    <div class="top-actions">
      <button id="btn-history" class="icon-btn" type="button" data-tip="Histori versi" aria-label="Histori versi"><span class="ms">history</span></button>
      <button id="btn-theme" class="icon-btn" type="button" data-tip="Tema" aria-label="Tema"><span class="ms">palette</span></button>
      <button id="btn-share" class="btn primary share" type="button"><span class="ms">lock</span><span>Bagikan</span></button>
    </div>
  </header>

  <div id="toolbar" class="toolbar glass" role="toolbar" aria-label="Bilah alat"></div>
  <div id="fxbar" class="fxbar glass"></div>

  <main class="workspace">
    <div id="grid-wrap" class="grid-wrap">
      <div id="grid" class="grid"></div>
    </div>
    <aside id="sidebar" class="sidebar glass" aria-label="Panel samping"></aside>
  </main>

  <footer class="bottombar glass">
    <button id="add-sheet" class="icon-btn" type="button" data-tip="Tambahkan sheet|Shift+F11" aria-label="Tambahkan sheet"><span class="ms">add</span></button>
    <button id="all-sheets" class="icon-btn" type="button" data-tip="Semua sheet" aria-label="Semua sheet"><span class="ms">menu</span></button>
    <div id="tabs" class="tabs" role="tablist"></div>
    <div id="stats" class="stats"></div>
    <div class="zoom">
      <button id="zoom-out" class="icon-btn sm" type="button" aria-label="Perkecil"><span class="ms">remove</span></button>
      <input id="zoom-range" type="range" min="50" max="200" step="5" value="100" aria-label="Zoom">
      <button id="zoom-in" class="icon-btn sm" type="button" aria-label="Perbesar"><span class="ms">add</span></button>
      <button id="zoom-val" class="zoom-val" type="button">100%</button>
    </div>
  </footer>
</div>

<div id="linkchip" class="linkchip glass"></div>
<div id="pagechip" class="pagechip glass" role="status"></div>
<div id="celltip" class="celltip glass"></div>
<div id="popups"></div>
<div id="dialogs"></div>
<div id="toasts"></div>
<div class="loader" aria-hidden="true"><img src="icon.svg" alt="" width="56" height="56"><div class="bar"><i></i></div></div>
<noscript><p style="padding:24px;font-family:sans-serif">Amatu Sheets memerlukan JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
